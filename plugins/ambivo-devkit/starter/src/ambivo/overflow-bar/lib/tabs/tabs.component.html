<div
  #container
  class="tabs-container"
  [class.density-compact]="density() === 'compact'"
  [class.density-normal]="density() === 'normal'"
  [class.density-comfortable]="density() === 'comfortable'"
  [class.align-right]="align() === 'right'"
>
  <!-- Visible tabs -->
  @for (item of visibleItems(); track trackByItemId($index, item)) {
    <button
      type="button"
      class="tab"
      [class.active]="isActive(item.id)"
      [class.disabled]="item.disabled"
      [disabled]="item.disabled"
      [matTooltip]="item.disabled ? item.disabledTooltip || '' : ''"
      [amMeasureWidth]="item.id"
      (amWidthChange)="onItemWidth($event)"
      (click)="onItemClick(item, $event)"
    >
      @if (item.error) {
        <mat-icon class="tab-error-icon">info</mat-icon>
      } @else if (item.color) {
        <span class="tab-color" [style.background-color]="item.color"></span>
      } @else if (item.icon) {
        <mat-icon>{{ item.icon }}</mat-icon>
      }
      <span class="tab-label" [class.truncate]="item.truncate" [class.tab-error]="item.error">{{
        item.label
      }}</span>

      <!-- Close button -->
      @if (item.closable) {
        <button
          type="button"
          class="tab-close"
          (click)="onCloseClick(item, $event)"
          [attr.aria-label]="'Close ' + item.label"
        >
          <mat-icon>close</mat-icon>
        </button>
      }

      @if (showIndicator()) {
        <div class="tab-indicator" [class.tab-error]="item.error"></div>
      }
    </button>
  }

  <!-- More menu for overflow tabs -->
  @if (hasOverflow()) {
    <button
      mat-icon-button
      [matMenuTriggerFor]="moreMenu"
      [amMeasureWidth]="'__more__'"
      (amWidthChange)="onItemWidth($event)"
    >
      @if (hasOverflowError()) {
        <mat-icon class="tab-error-icon">info</mat-icon>
      } @else {
        <mat-icon>more_horiz</mat-icon>
      }
    </button>

    <mat-menu #moreMenu="matMenu">
      @for (item of overflowItems(); track trackByItemId($index, item)) {
        <button
          mat-menu-item
          [disabled]="item.disabled"
          [class.active]="isActive(item.id)"
          (click)="onItemClick(item)"
        >
          @if (item.error) {
            <mat-icon class="tab-error-icon">info</mat-icon>
          } @else if (item.color) {
            <span class="tab-color" [style.background-color]="item.color"></span>
          } @else if (item.icon) {
            <mat-icon>{{ item.icon }}</mat-icon>
          }
          <span>{{ item.label }}</span>
        </button>
      }
    </mat-menu>
  }
</div>

<!-- Tab content -->
@if (activeTabContent(); as content) {
  <ng-container [ngTemplateOutlet]="content" />
}
